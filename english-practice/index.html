<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>English Practice</title>

<link
  rel="stylesheet"
  href="styles.css?v=3"
>

<link
  rel="manifest"
  href="./manifest.webmanifest"
>

<meta
  name="theme-color"
  content="#8c5d32"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="English Practice"
>


<style>

/* =========================================================
   TELA DE ABERTURA
   ========================================================= */

#startScreen{
  position:fixed;
  inset:0;
  z-index:99999;

  background:#000;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:auto;
}


.start-cover{
  position:relative;

  width:min(100%,900px);

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;
}


.start-cover img{
  display:block;

  width:100%;
  height:auto;

  max-height:100vh;

  object-fit:contain;
}


/* TEXTO DOS IDIOMAS */

.start-language{
  position:absolute;

  top:18px;
  left:50%;

  transform:translateX(-50%);

  z-index:4;

  padding:10px 22px;

  border:2px solid #39ff14;
  border-radius:14px;

  background:rgba(0,20,0,.80);

  color:#39ff14;

  font-size:clamp(18px,3vw,30px);
  font-weight:900;

  text-align:center;

  white-space:nowrap;

  box-shadow:
    0 0 8px #39ff14,
    0 0 20px rgba(57,255,20,.7);

  text-shadow:
    0 0 8px #39ff14;

  transition:
    opacity .35s ease,
    transform .35s ease;
}


.start-language.hide{
  opacity:0;

  transform:
    translateX(-50%)
    translateY(-8px);
}


/* BOTÃO START */

#startCoverBtn{
  position:absolute;

  right:8%;
  top:27%;

  z-index:5;

  border:2px solid #39ff14;

  border-radius:999px;

  padding:14px 28px;

  background:rgba(255,255,255,.95);

  color:#118a00;

  font-size:clamp(18px,2.8vw,30px);

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 0 10px rgba(57,255,20,.8),
    0 0 25px rgba(57,255,20,.45);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}


#startCoverBtn:hover{
  transform:scale(1.05);

  box-shadow:
    0 0 15px #39ff14,
    0 0 35px rgba(57,255,20,.75);
}


#startCoverBtn:active{
  transform:scale(.97);
}


/* ESCONDER A PÁGINA NORMAL
   ENQUANTO A CAPA ESTIVER ABERTA */

body.start-open > header,
body.start-open > main{
  display:none;
}


/* CELULAR */

@media(max-width:700px){

  .start-language{
    top:12px;

    padding:7px 14px;

    font-size:17px;
  }


  #startCoverBtn{
    right:6%;
    top:25%;

    padding:11px 20px;

    font-size:18px;
  }

}

</style>

</head>


<body class="start-open">


<!-- ======================================================
     PARTE 1 - TELA DE ABERTURA
     ====================================================== -->

<section id="startScreen">

  <div class="start-cover">

    <img
      src="brave-cover-start.png"
      alt="English Practice Memory"
    >


    <div
      id="startLanguage"
      class="start-language"
    >
      English 🇬🇧
    </div>


    <button
      id="startCoverBtn"
      type="button"
    >
      START
    </button>

  </div>

</section>



<!-- ======================================================
     PROGRAMA ORIGINAL
     ====================================================== -->

<header>

  <div>

    <h1>
      English Practice
    </h1>

    <p>
      Treino progressivo de palavras e frases
    </p>

  </div>

  <span id="saved">
    ✓ Salvo automaticamente
  </span>

</header>


<main>


<section id="setup">


  <div class="card">


    <div class="headrow">


      <div>

        <h2>
          📚 Meu material
        </h2>

        <p>
          Tudo fica salvo neste navegador.
        </p>

      </div>


      <div>

        <button id="newMat">
          + Novo material
        </button>

        <button id="delMat">
          Excluir
        </button>

      </div>


    </div>


    <div class="two">


      <div>

        <label>
          Material salvo
        </label>

        <select id="matSelect"></select>

      </div>


      <div>

        <label>
          Nome
        </label>

        <input id="matName">

      </div>


    </div>


    <label>
      Palavras e frases
    </label>


    <textarea
      id="raw"
      placeholder="go | cat | book | house | good morning | how are you?"
    ></textarea>


    <p class="tip">

      Separe cada item com

      <b>|</b>

    </p>


    <div class="buttons">


      <button
        id="organize"
        class="primary"
      >
        Organizar material
      </button>


      <button
        id="start"
        class="dark"
      >
        ▶ Começar treino
      </button>


    </div>


  </div>



  <div class="card">


    <div class="headrow">


      <h2>
        🧩 Material organizado
      </h2>


      <span id="total">
        0 itens
      </span>


    </div>


    <div id="summary"></div>


  </div>


</section>



<section
  id="train"
  class="hidden"
>


  <div class="trainhead">


    <button id="back">
      ← Material
    </button>


    <div class="centerhead">


      <b id="title">
        Meu material
      </b>


      <span id="progress"></span>


    </div>


    <button
      id="menu"
      class="hamb"
    >
      ☰
    </button>


  </div>



  <div
    id="settings"
    class="card hidden"
  >


    <div class="headrow">


      <h3>
        ⚙️ Configurações
      </h3>


      <button id="closeMenu">
        ×
      </button>


    </div>



    <div class="three">


      <div>


        <label>
          Nível
        </label>


        <select id="level"></select>


      </div>



      <div>


        <label>
          Tempo
        </label>


        <div class="time">


          <input
            id="secs"
            type="number"
            min="1"
            max="300"
          >


          <span>
            segundos
          </span>


        </div>


      </div>



      <div>


        <label>
          Tamanho
        </label>


        <div class="buttons">


          <button id="smaller">
            A−
          </button>


          <button id="autoFont">
            Auto
          </button>


          <button id="bigger">
            A+
          </button>


        </div>


      </div>


    </div>



    <input
      id="range"
      type="range"
      min="1"
      max="300"
    >



    <div class="quick">


      <button data-s="1">
        1s
      </button>


      <button data-s="2">
        2s
      </button>


      <button data-s="3">
        3s
      </button>


      <button data-s="5">
        5s
      </button>


      <button data-s="10">
        10s
      </button>


      <button data-s="30">
        30s
      </button>


      <button data-s="60">
        1min
      </button>


      <button data-s="120">
        2min
      </button>


      <button data-s="300">
        5min
      </button>


    </div>


  </div>



  <div class="card">


    <div class="meta">


      <span id="badge"></span>


      <span id="clock"></span>


    </div>



    <div id="stage">


      <div id="shown">
        READY
      </div>



      <div
        id="answerBox"
        class="hidden"
      >


        <div class="answerlabel">

          Escreva o que você viu

        </div>


        <input
          id="answer"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >


        <div id="feedback"></div>


      </div>


    </div>



    <div class="controls">


      <button id="prev">
        ← Anterior
      </button>


      <button
        id="replay"
        class="primary"
      >
        ↻ Mostrar de novo
      </button>


      <button
        id="next"
        class="dark"
      >
        Próximo →
      </button>


    </div>



    <div class="controls smallcontrols">


      <button id="prevLevel">
        ← Nível anterior
      </button>


      <button id="pause">
        ⏸ Pausar
      </button>


      <button id="nextLevel">
        Próximo nível →
      </button>


    </div>


  </div>


</section>


</main>



<script src="app.js?v=3"></script>


<script>

/* =========================================================
   PARTE 1 - IDIOMAS DA CAPA
   ========================================================= */

const coverLanguages = [

  "English 🇬🇧",

  "Português 🇧🇷",

  "Italiano 🇮🇹",

  "Română 🇷🇴",

  "Español 🇪🇸",

  "Français 🇫🇷",

  "Deutsch 🇩🇪"

];


let coverLanguageIndex = 0;


const startLanguage =
  document.getElementById("startLanguage");


function changeCoverLanguage(){

  if(!startLanguage){
    return;
  }


  startLanguage.classList.add("hide");


  setTimeout(() => {

    coverLanguageIndex++;

    if(
      coverLanguageIndex >=
      coverLanguages.length
    ){
      coverLanguageIndex = 0;
    }


    startLanguage.textContent =
      coverLanguages[coverLanguageIndex];


    startLanguage.classList.remove("hide");

  },350);

}


setInterval(
  changeCoverLanguage,
  1800
);



/* =========================================================
   BOTÃO START
   ========================================================= */

const startCoverBtn =
  document.getElementById("startCoverBtn");


const startScreen =
  document.getElementById("startScreen");


if(startCoverBtn){

  startCoverBtn.addEventListener(
    "click",
    () => {

      if(startScreen){
        startScreen.style.display = "none";
      }


      document.body.classList.remove(
        "start-open"
      );

    }
  );

}



/* =========================================================
   SERVICE WORKER
   ========================================================= */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker.register(
        "./sw.js?v=3",
        {
          updateViaCache: "none"
        }
      );

    }
  );

}

</script>


</body>

</html>
